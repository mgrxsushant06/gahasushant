<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#0F172A" />
  
  <!-- Subtle Border Accent -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Active Accent Dot -->
  <circle cx="50" cy="14" r="4" fill="url(#blueGrad)" filter="url(#glow)" />
  <circle cx="50" cy="14" r="1.5" fill="#FFFFFF" />

  <!-- Monogram Logo: WS -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="-1.5">
    <text x="10" y="44" fill="#FFFFFF">W</text>
    <text x="35" y="44" fill="url(#blueGrad)">S</text>
  </g>

  <!-- Bottom Tech Underline -->
  <rect x="14" y="51" width="36" height="3" rx="1.5" fill="url(#blueGrad)" />
</svg>
